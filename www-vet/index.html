<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14233F">
<title>الخنساء للصيدليات البيطرية</title>
<style>
:root{--bg:#EEF1F6;--card:#FFFFFF;--ink:#121A2B;--mut:#5E6A80;--line:#DCE1EA;--soft:#E4E9F2;
--pri:#14233F;--onpri:#FFFFFF;--tag:#F2A71B;--ontag:#1B1403;--ok:#1F8A5B;--okbg:#DDF3E8;
--bad:#C93B2B;--badbg:#FBE3DF;--low:#B56A00;--lowbg:#FFEFD2;--hd:#14233F;--onhd:#FFFFFF;color-scheme:light}
html[data-theme=dark]{--bg:#0D1320;--card:#161E2E;--ink:#E9EDF5;--mut:#93A0B8;--line:#28334A;--soft:#1E283B;
--pri:#F2A71B;--onpri:#1B1403;--ok:#4CC38A;--okbg:#143326;--bad:#FF7B6B;--badbg:#3A1B17;--low:#FFC25C;--lowbg:#3A2A0E;
--hd:#161E2E;--onhd:#E9EDF5;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.45;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
b,strong,h1,h2,h3{font-weight:800}
.num,.tag,.pr,.qv{font-variant-numeric:tabular-nums}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* الرأس */
.hd{background:var(--hd);color:var(--onhd);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;min-height:56px;flex:none}
.hd h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;gap:6px}
.ib{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.hd .ib{background:rgba(255,255,255,.12)}
.ib.sm{width:36px;height:36px;background:var(--soft)}
.ib.bad{color:var(--bad)}
.ratechip{background:var(--tag);color:var(--ontag);font-weight:800;font-size:13px;padding:7px 10px;border-radius:9px}

/* المحتوى */
.main{flex:1;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
.sec{font-size:15px;margin:20px 2px 8px;display:flex;align-items:center;gap:8px;color:var(--mut)}
.sec .cnt{background:var(--pri);color:var(--onpri);border-radius:8px;padding:0 8px;font-size:13px}
.sec .lk{margin-inline-start:auto;color:var(--pri);font-weight:800;font-size:14px}
html[data-theme=dark] .sec .lk{color:var(--tag)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.card p.sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:var(--pri);color:var(--onpri);border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;font-size:17px;text-align:start}
.big svg.ic{width:30px;height:30px}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--soft);color:var(--ink);min-height:48px}
.btn.pri{background:var(--pri);color:var(--onpri)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line)}
.btn.bad{color:var(--bad)}
.btn.wa{background:#1FA855;color:#fff}
.btn.sm{padding:8px 12px;min-height:40px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btn:active,.big:active,.pc:active,.li[data-a]:active{transform:scale(.985)}
.fab{position:absolute;inset-inline-end:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tag);color:var(--ontag);border-radius:16px;padding:14px 18px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(10,20,40,.28);z-index:5}

/* بطاقة السعر: العنصر المميز */
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--tag);color:var(--ontag);font-weight:800;padding:6px 12px 6px 18px;
clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 calc(50% + 7px),7px 50%,0 calc(50% - 7px));border-radius:0 8px 8px 0}
.tag.lg{font-size:20px;padding:10px 16px 10px 24px}
.tag small{font-weight:600;font-size:12px;opacity:.8}

/* القوائم */
.li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;width:100%;text-align:start}
.li .gr{flex:1;min-width:0}
.li .gr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{color:var(--mut);font-size:13px;display:block}
.li .lt{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.li.off{opacity:.6}.li.off b{text-decoration:line-through}
.av{width:42px;height:42px;border-radius:12px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.badge.low{background:var(--lowbg);color:var(--low)}
.badge.out{background:var(--badbg);color:var(--bad)}
.badge.neu{background:var(--soft);color:var(--mut)}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qv{min-width:44px;height:36px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-weight:800;padding:0 6px}
.empty{text-align:center;color:var(--mut);padding:36px 16px}
.empty svg.ic{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.note{font-size:13px;color:var(--mut);margin:6px 2px}
.warn{background:var(--lowbg);color:var(--low);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:center;width:100%;text-align:start}
.err{background:var(--badbg);color:var(--bad)}
.lic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;width:100%;text-align:start}
.lic u{margin-inline-start:auto;color:var(--pri);font-weight:800}
html[data-theme=dark] .lic u{color:var(--tag)}

/* شريط الدفع */
.pay{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.payrow{display:flex;gap:8px;align-items:center}
.payrow .btn{flex:1}.payrow .tag{flex:1.2;justify-content:space-between;font-size:17px;padding-inline-end:10px}
.tag{white-space:nowrap}

/* التنقل السفلي */
.nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px;color:var(--mut);font-size:12px;font-weight:700}
.nav button.on{color:var(--pri);background:var(--soft)}
html[data-theme=dark] .nav button.on{color:var(--tag)}

/* الحقول */
.f{display:block;margin-bottom:12px;font-size:14px;font-weight:700;color:var(--mut)}
.f input,.f select,.f textarea,.inp{display:block;width:100%;margin-top:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:600;color:var(--ink);outline:none}
.f input:focus,.inp:focus,.f select:focus{border-color:var(--tag)}
.frow{display:flex;gap:8px;align-items:flex-end}
.frow .f{flex:1}
.seg{display:inline-flex;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 12px;border-radius:9px;font-weight:800;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--pri);color:var(--onpri)}
.opt{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .gr{flex:1}.opt .gr small{display:block;color:var(--mut);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(-20px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--mut)}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.srch{position:relative;margin-bottom:10px}
.srch input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 44px 12px 12px;font-size:16px;outline:none;color:var(--ink)}
.srch svg.ic{position:absolute;inset-inline-start:13px;top:13px;color:var(--mut)}

/* شبكة المنتجات */
.pg{display:grid;gap:8px}
.pg.c2{grid-template-columns:repeat(2,1fr)}.pg.c3{grid-template-columns:repeat(3,1fr)}.pg.c4{grid-template-columns:repeat(4,1fr)}
.pc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.pc.sel{border-color:var(--tag);box-shadow:0 0 0 2px var(--tag) inset}
.pc b{font-size:14px;line-height:1.25;max-height:2.5em;overflow:hidden;width:100%;word-break:break-word}
.pc .pr{font-size:13px;font-weight:800;color:var(--mut)}
.pc .av{width:36px;height:36px;font-size:16px;border-radius:10px}
.pg.sm{gap:6px}.pg.sm .pc{padding:7px 3px;gap:3px;border-radius:11px}.pg.sm .pc .av{width:26px;height:26px;font-size:13px;border-radius:8px}.pg.sm .pc b{font-size:12px}.pg.sm .pc .pr{font-size:11.5px}
.pc .bs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.bq{background:var(--tag);color:var(--ontag);border-radius:8px;padding:2px 7px;font-size:12px;font-weight:800;font-style:normal}
.qbar{flex:none;background:var(--card);border-top:2px solid var(--tag);padding:10px 14px}
.qbar .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbar .top .gr{flex:1;min-width:0}
.qbar .ctl{display:flex;gap:6px;align-items:center}
.qbar .ctl input{flex:1;min-width:0;text-align:center;font-weight:800;font-size:18px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;outline:none}
.rb{width:48px;height:48px;border-radius:50%;background:var(--soft);font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.donebar{flex:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}

/* النوافذ السفلية */
.shade{position:absolute;inset:0;background:rgba(8,14,26,.55);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:90%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
.sheet h3{margin:0 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:860px){html.wide #app{max-width:none}html.wide .main{padding-inline:22px}html.wide .pg.c2{grid-template-columns:repeat(4,1fr)}html.wide .pg.c3{grid-template-columns:repeat(5,1fr)}html.wide .pg.c4{grid-template-columns:repeat(7,1fr)}html.wide .shade{justify-content:center}html.wide .sheet{max-width:680px;margin-inline:auto}html.wide .tbls{grid-template-columns:repeat(6,1fr)}}
.tbls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tb{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;min-height:78px;justify-content:center}
.tb b{font-size:22px}.tb small{font-size:12px;color:var(--mut);font-weight:700}
.tb.busy{background:var(--lowbg);border-color:var(--tag)}.tb.busy small{color:var(--low)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.sw,.sw::after{transition:none}}
#toast{position:fixed;inset-inline:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;justify-content:center;pointer-events:none}
#toast div{white-space:pre-line;background:#101827;color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;max-width:560px;box-shadow:0 6px 20px rgba(0,0,0,.35)}

/* الجداول والإحصائيات */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--mut);font-weight:700;text-align:start;padding:6px 4px;border-bottom:1.5px solid var(--line);font-size:13px}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child,.tbl th:last-child{text-align:end;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.kv span{color:var(--mut)}.kv b{text-align:end}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.st{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center}
.st small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.st b{font-size:15px;display:block;margin-top:2px;word-break:break-word}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn{flex-direction:column;padding:14px 8px;gap:6px;font-size:14px}
.rcpt{background:#fff;border:1px solid var(--line);border-radius:10px;width:100%;display:block}

/* الماسح */
.scan{position:absolute;inset:0;background:#000;color:#fff;z-index:10;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sctop{position:relative;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(#000a,#0000)}
.sctop b{flex:1;font-size:18px}
.sctop .ib{background:rgba(255,255,255,.18)}
.frame{position:relative;flex:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
.frame i{display:block;width:74%;height:150px;border:3px solid var(--tag);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scmsg{position:relative;margin:0 14px 10px;min-height:54px}
.scmsg .m{background:rgba(16,24,39,.92);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:700}
.scmsg .m .gr{flex:1;min-width:0}
.scmsg .m.un{background:rgba(120,30,20,.95)}
.scbot{position:relative;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#000c)}
.scin{display:flex;gap:8px;margin-bottom:12px}
.scin input{flex:1;min-width:0;border-radius:12px;border:0;padding:11px 12px;font-size:16px;background:rgba(255,255,255,.92);color:#111;outline:none}
.scbtns{display:flex;justify-content:space-around}
.scbtns .rb{width:58px;height:58px;background:var(--tag);color:var(--ontag)}
.scbtns .rb.on{background:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g3 .big{align-items:center;padding:16px 6px;gap:10px;font-size:16px}
.ordhd{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--tag);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.ordhd .gr{flex:1;min-width:0}.ordhd b{font-size:17px}.ordhd small{display:block;color:var(--mut);font-size:13px}
.li small.nt{color:var(--low);font-weight:700}
.lock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.lock input{text-align:center;letter-spacing:8px;font-size:24px;max-width:220px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
(()=>{'use strict';
/* ============ الإعدادات الثابتة (بتتعدل من هون) ============ */
const VERSION='1.1.0';const EDITION='vet';const LITE=EDITION==='orders',KIND=['shop','acc','phone','pharm','cloth','build','solar','whole','stone','stat','sweet','bake','vet'].includes(EDITION)?'shop':'rest',APPNAME=LITE?'الخنساء طلبات':EDITION==='stat'?'الخنساء للمكتبات والقرطاسية':EDITION==='sweet'?'الخنساء لمحلات الحلويات':EDITION==='bake'?'الخنساء للأفران والمخابز':EDITION==='vet'?'الخنساء للصيدليات البيطرية والزراعية':EDITION==='cloth'?'الخنساء للألبسة والأحذية':EDITION==='build'?'الخنساء لمواد البناء والأدوات الصحية':EDITION==='solar'?'الخنساء للطاقة الشمسية':EDITION==='stone'?'الخنساء للمناشر ومعامل الحجر':EDITION==='whole'?'الخنساء لتجار الجملة والموزعين':EDITION==='acc'?'الخنساء محاسب':EDITION==='phone'?'الخنساء موبايل':EDITION==='pharm'?'الخنساء صيدلية':EDITION==='rest'?'الخنساء للمطاعم':'الخنساء كاشير';
const SUPPORT='963934664381';           // واتساب الدعم والتفعيل
const SECRET='Kh7#aNs4-c@sh1er/26x';    // سر توليد أكواد التفعيل (لازم يطابق صفحة المولّد)
const FREE_OPS=40;                      // عمليات البيع المجانية
const PACKS=[
 {id:1,type:'days',n:30,name:'اشتراك شهري',desc:'مبيعات بلا حدود لمدة 30 يوم',price:10},
 {id:2,type:'days',n:365,name:'اشتراك سنوي',desc:'مبيعات بلا حدود لمدة سنة كاملة',price:40},
 {id:3,type:'life',n:0,name:'مدى الحياة',desc:'العرض التوفيري: ادفع مرة واحدة واستخدم للأبد',price:100,best:true}
];

/* ============ أدوات عامة ============ */
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toLatin=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,'');
const num=v=>{let s=toLatin(v).trim();const m=s.match(/^(\d+)\s*\/\s*(\d+)$/);if(m&&+m[2])return +m[1]/+m[2];const n=parseFloat(s.replace(/,/g,'.').replace(/[^\d.\-]/g,''));return isFinite(n)?n:0};
const r3=x=>Math.round(x*1000)/1000;
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fq=q=>({0.25:'¼',0.5:'½',0.75:'¾'}[q]||fmt(q));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const p2=n=>String(n).padStart(2,'0');
const dt=t=>{const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`};

 ${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="num">${fq(i.qty)}</td><td class="num">${m(i.price)}</td><td class="num">${m(roundM(i.price*i.qty,s.cur))}</td></tr>`).join('')}</table>

/* ============ الكاميرا وقراءة الباركود ============ */
let camStream=null,detector=null,scanT=0,lastCode='',lastT=0,camTried=false;
async function camStart(){if(camStream||camTried)return;camTried=true;ui.camErr='';
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ui.camErr='الكاميرا غير متاحة على هذا الجهاز. اكتب الباركود في الخانة بالأسفل.';return}
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false})}
 catch(e){ui.camErr='لم يُسمح باستخدام الكاميرا. اسمح بها من إعدادات الهاتف، أو اكتب الباركود في الخانة بالأسفل.';return}
 if('BarcodeDetector' in window){try{const want=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar','qr_code'];let f=want;
   try{const sup=await window.BarcodeDetector.getSupportedFormats();f=want.filter(x=>sup.includes(x))}catch(e){}
   detector=new window.BarcodeDetector({formats:f})}catch(e){detector=null}}
 if(!detector)ui.camErr='قراءة الباركود بالكاميرا غير مدعومة على هذا الجهاز. اكتب الباركود بالأسفل أو استخدم قارئ باركود خارجي.'}
function camStop(){clearTimeout(scanT);if(camStream){try{camStream.getTracks().forEach(t=>t.stop())}catch(e){}camStream=null}camTried=false;ui.torch=false;ui.paused=false}
async function camAttach(){await camStart();const t=topE();if(!t||t.name!=='scan')return;const v=$('#cam');
 if(v&&camStream&&v.srcObject!==camStream){v.srcObject=camStream;v.play().catch(()=>{})}scanUI();clearTimeout(scanT);scanT=setTimeout(scanTick,300)}
async function scanTick(){const t=topE();if(!t||t.name!=='scan')return;const v=$('#cam');
 if(detector&&v&&v.readyState>=2&&!ui.paused){try{const r=await detector.detect(v);if(r.length){const code=r[0].rawValue,n=Date.now();
   if(code&&!(code===lastCode&&n-lastT<2500)){lastCode=code;lastT=n;onCode(code)}}}catch(e){}}
 scanT=setTimeout(scanTick,220)}
function handleScan(code,cn){code=toLatin(code).trim();if(!code)return null;const p=prodByCode(code);
 if(!p){beep(false);ui.last={unknown:code};return null}addCart(cn,p,1);beep();buzz();ui.last={name:p.name,price:pPrice(p)};return p}
function onCode(code){const t=topE();if(!t||t.name!=='scan')return;
 if(t.p.field){if(!ui.pd)ui.pd=newDraft();ui.pd.barcode=toLatin(code).trim();beep();buzz();back();return}
 handleScan(code,t.p.cn);scanUI()}
function scanUI(){const t=topE();if(!t||t.name!=='scan')return;const cn=t.p.cn,tot=$('#sctot'),m=$('#scmsg'),L=ui.last;
 if(tot)tot.innerHTML=t.p.field?'':`<span class="tag">${fq(cartCount(carts[cn]))} قطعة، ${money(cartTotal(carts[cn]))}</span>`;if(!m)return;
 if(L&&L.unknown)m.innerHTML=`<div class="m un"><div class="gr">باركود غير مسجّل<br><small>${esc(L.unknown)}</small></div><button class="btn sm" data-a="addunknown">إضافة للمخزون</button></div>`;
 else if(L&&S().showLast)m.innerHTML=`<div class="m"><div class="gr">${esc(L.name)}</div><span class="tag">${money(L.price)}</span></div>`;
 else if(ui.camErr)m.innerHTML=`<div class="m un"><div class="gr">${esc(ui.camErr)}</div></div>`;else m.innerHTML=''}
/* قارئ باركود خارجي (بلوتوث أو USB) يعمل كلوحة مفاتيح */
let kb='',kbT=0;
document.addEventListener('keydown',e=>{const g=e.target;if(g&&/^(INPUT|TEXTAREA|SELECT)$/.test(g.tagName)){
  if(e.key==='Enter'){if(g.id==='mcode'){e.preventDefault();A.mcode()}else if(g.id==='actcode')A.doact();else if(g.id==='pinin')A.unlock()}return}
 const n=Date.now();if(n-kbT>90)kb='';kbT=n;
 if(e.key==='Enter'){const code=kb;kb='';if(code.length>=4)extScan(code)}else if(e.key&&e.key.length===1)kb+=e.key});
function extScan(code){if(!DB.ready)return;const t=topE();
 if(t&&t.name==='prod'){ui.pd=readProd();ui.pd.barcode=toLatin(code).trim();render();return}
 if(t&&t.name==='scan'){onCode(code);return}
 if(t&&t.sheet)return;
 const cn=t&&(t.name==='quick'||(t.p&&t.p.cn==='quick'))?'quick':'sale';const p=handleScan(code,cn);
 toast(p?`${p.name}، ${money(pPrice(p))}`:'باركود غير مسجّل: '+code);render()}

  const data={name:d.name,barcode:d.barcode,price,cur,cost:num(d.cost),ccur:d.ccur,track:!!d.track,stock:d.track?num(d.stock):0,cat:d.cat,exp:d.exp||'',wprice:num(d.wp||'')};
  if(d.cat&&!DB.cats.includes(d.cat))DB.cats.push(d.cat);S().lastCur=d.cur;let p;
  if(d.id){p=prodById(d.id);const old=p.price,oc=p.cur;Object.assign(p,data);logA(`تعديل منتج: ${p.name}`+((old!==price||oc!==cur)?`، السعر من ${money(old,oc)} إلى ${money(price,cur)}`:''))}
  else{p=Object.assign({id:uid(),sold:0,t:Date.now()},data);DB.products.push(p);logA('إضافة منتج: '+p.name);if(ui.after){addCart(ui.after.cn,p,1);ui.after=null}}
  flush();toast('تم حفظ المنتج');if(!d.id&&d.more){ui.pd=newDraft();render()}else{ui.pd=null;back()}},

 if(!navigator.onLine)return 'لا يوجد اتصال بالإنترنت';
 try{const r=await (await fetch(`${ADMIN_URL}?a=activate&code=${code}&dev=${DB.lic.dev}&store=${encodeURIComponent(S().store||'')}`)).json();
  if(!r||!r.ok)return (r&&r.msg)||'الكود غير صحيح أو مستخدم';
  const l=DB.lic,days=r.type==='life'?200*365:(+r.days||30);l.until=Math.max(l.until,licNow())+days*DAY;logA('تفعيل عبر الإنترنت: '+(r.name||days+' يوم'));flush();return ''}
 catch(e){return 'تعذّر الاتصال بالخادم، حاول لاحقاً'}}

 try{const r=await (await fetch(`${ADMIN_URL}?a=config&dev=${DB.lic.dev}&ver=${VERSION}`)).json();if(!r)return;DB.remote=Object.assign({t:Date.now()},r);
  const rt=rateFor(r);if(rt>0&&rt!==S().rate&&S().rateAuto&&rateSane(rt)){S().rate=rt;S().rateAt=Date.now();logA('تحديث سعر الصرف تلقائياً إلى '+fmt(rt));toast('تم تحديث سعر الصرف إلى '+fmt(rt))}
  save();if(r.force&&verNewer(r.ver))open('upd',{},true);else render()}catch(e){}}

function drawerCalc(){const last=DB.closes[0],since=last?last.t:0,cur=S().cur;let sales=0,debts=0,exp=0,sham=0;for(const s of DB.sales)if(!s.refunded&&s.t>since)sham+=conv(shamPart(s),s.cur,cur,s.rate);let tips=0;for(const x of DB.tips||[])if(x.t>since&&x.box==='cash')tips+=(x.kind==='out'?-1:1)*conv(x.amt,x.cur,cur);
 for(const s of DB.sales)if(!s.refunded&&s.t>since)sales+=conv(cashPart(s),s.cur,cur,s.rate);
 for(const l of DB.ledger)if(l.t>since&&l.amt<0&&!l.sid)debts+=conv(-l.amt,l.cur,cur);
 for(const e of DB.expenses)if(e.t>since&&e.drawer)exp+=conv(e.amt,e.cur,cur);
 for(const l of DB.sledger)if(l.t>since&&l.drawer&&l.amt<0)exp+=conv(-l.amt,l.cur,cur);
 return {since,sales:roundM(sales),debts:roundM(debts),exp:roundM(exp),exp2:roundM(sales+debts-exp+tips),sham:roundM(sham),tips:roundM(tips)}}

const NB=()=>{try{return isNative()&&window.Capacitor.Plugins.BluetoothLe||null}catch(e){return null}};
const hexOf=u8=>Array.from(u8,b=>b.toString(16).padStart(2,'0')).join('');
async function nbInit(){if(nbInit.ok)return;await NB().initialize({androidNeverForLocation:true});nbInit.ok=1}
async function nbOpen(slot,deviceId,name){const P=NB();bs(slot);await nbInit();
 try{await P.disconnect({deviceId})}catch(e){}
 try{await P.addListener('disconnected|'+deviceId,()=>{if(ble[slot].id===deviceId)ble[slot].ch=null})}catch(e){}
 await P.connect({deviceId,timeout:12000});
 const svs=((await P.getServices({deviceId}))||{}).services||[];let pick=null;
 for(const sv of svs){for(const c of sv.characteristics||[]){const pr=c.properties||{},o={svc:sv.uuid,uuid:c.uuid,write:!!pr.write,wwr:!!pr.writeWithoutResponse};
   if(o.write){pick=o;break}if(!pick&&o.wwr)pick=o}if(pick&&pick.write)break}
 if(!pick)throw new Error('لم يتم العثور على قناة طباعة');
 try{await P.requestConnectionPriority({deviceId,connectionPriority:1})}catch(e){}
 let mtu=0;try{mtu=((await P.getMtu({deviceId}))||{}).value||0}catch(e){}
 const chunk=pick.write?500:(mtu>23?Math.min(180,mtu-3):20);
 const arg=v=>({deviceId,service:pick.svc,characteristic:pick.uuid,value:hexOf(v)});
 ble[slot].ch={chunk,mtu,wchunk:mtu>23?Math.min(509,mtu-3):20,properties:{write:pick.write,writeWithoutResponse:pick.wwr},writeValueWithResponse:v=>P.write(arg(v)),writeValueWithoutResponse:v=>P.writeWithoutResponse(arg(v))};
 ble[slot].id=deviceId;ble[slot].name=name||'طابعة';
 const bt=S().bt||(S().bt={});bt[slot]={id:deviceId,name:ble[slot].name};save()}
async function nbStart(){const P=NB();if(!P)return;try{await nbInit();const r=await P.isEnabled();if(!(r&&r.value))await P.requestEnable()}catch(e){}await nbAuto()}
async function nbAuto(){if(!NB()||!S().bt)return;for(const slot of (S().onePr?['c']:['c'].concat(kStations().map(s=>s.id)))){bs(slot);const x=S().bt[slot];if(!x||ble[slot].ch)continue;
 try{await nbOpen(slot,x.id,x.name);toast('تم الاتصال بـ '+x.name)}catch(e){}}
 if(topE()&&topE().name==='printer'||tab==='set')render()}

function countCalc(i){const c=DB.counts[i],p=DB.counts[i+1];if(!c)return null;const st=p?p.t:0,cv=matVal(c),pv=p?matVal(p):0,
 pu=purTotal(st+1,c.t)+DB.expenses.filter(e=>e.cat==='مواد غذائية'&&inR(e.t,st+1,c.t)).reduce((a,e)=>a+conv(e.amt,e.cur,S().cur),0);
 let rev=0;for(const s of DB.sales)if(!s.refunded&&inR(s.t,st+1,c.t))rev+=conv(s.total,s.cur,S().cur,s.rate);
 const used=pv+pu-cv;return {c,p,cv,pv,pu,used,rev,pct:rev>0?Math.round(used/rev*100):0}}

/* ============ التفعيل بالتوقيع الرقمي (ECDSA P-256) ============ */
const LIC_PUB={"kty":"EC","x":"NJh46vFPpcxir6kF0SnZNMuBgAh5PShcHfGhZ7TSGgs","y":"FQ0ySKDeyUrA3bSVjP5wTWWSZCDXOSodKKeHRDELJhQ","crv":"P-256"};
const b64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function activateSigned(raw){const m=String(raw).trim().match(/^KH1-([123])-([A-Za-z0-9_-]{80,90})$/);if(!m)return 'الكود ناقص أو فيه غلط. انسخه كامل من الرسالة';
 if(!(window.crypto&&crypto.subtle))return 'هالجهاز ما بيدعم التحقق من الكود';
 const l=DB.lic,pk=PACKS.find(p=>p.id===+m[1]);
 try{const key=await crypto.subtle.importKey('jwk',LIC_PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u(m[2]),new TextEncoder().encode(`KH1|${l.dev}|${l.serial+1}|${pk.id}`));
  if(!ok)return 'الكود مو لهالجهاز أو مستعمل قبل';}catch(e){return 'تعذّر التحقق من الكود'+errT(e)}
 l.serial++;if(pk.type==='life')l.until=Math.max(l.until,licNow())+200*365*DAY;else l.until=Math.max(l.until,licNow())+pk.n*DAY;
 logA('تفعيل: '+pk.name);flush();setTimeout(adminCheck,500);return ''}

const ACC=EDITION==='acc';
function accInit(){for(const k of ['vouchers','partners','pledger','assets','quotes','offers'])if(!Array.isArray(DB[k]))DB[k]=[]}
const cv=(a,c,r)=>conv(a,c||S().cur,S().cur,r);
const BOXES=[['cash','الصندوق (كاش)'],['sham','شام كاش']];
const boxName=b=>b==='sham'?'شام كاش':'الصندوق';
/* حركات الصناديق مجمعة من كل الدفاتر */
function boxMoves(){accInit();const m=[];
 for(const s of DB.sales)if(!s.refunded&&s.paid>0){const sp=shamPart(s),cp=cashPart(s);if(cp)m.push({t:s.t,box:'cash',v:cv(cp,s.cur,s.rate),txt:'بيع فاتورة '+s.no});if(sp)m.push({t:s.t,box:'sham',v:cv(sp,s.cur,s.rate),txt:'بيع فاتورة '+s.no})}
 for(const l of DB.ledger)if(l.amt<0&&!l.sid)m.push({t:l.t,box:l.box||'cash',v:cv(-l.amt,l.cur),txt:'قبض دين: '+((custById(l.cid)||{}).name||'')});
 for(const e of DB.expenses)if(e.drawer)m.push({t:e.t,box:e.box||'cash',v:-cv(e.amt,e.cur),txt:e.cat+(e.note?' · '+e.note:'')});
 for(const l of DB.sledger)if(l.drawer&&l.amt<0){const s=DB.suppliers.find(x=>x.id===l.sid);m.push({t:l.t,box:l.box||'cash',v:-cv(-l.amt,l.cur),txt:'دفعة للمورد '+(s?s.name:'')})}
 for(const v of DB.vouchers)m.push({t:v.t,box:v.box,v:(v.type==='in'?1:-1)*cv(v.amt,v.cur),txt:(v.type==='in'?'سند قبض':'سند دفع')+(v.party?' · '+v.party:'')+(v.note?' · '+v.note:''),vid:v.id});
 for(const l of DB.pledger)if(l.kind!=='profit'&&l.box){const p=DB.partners.find(x=>x.id===l.pid);m.push({t:l.t,box:l.box,v:l.kind==='cap'?cv(l.amt,l.cur):-cv(l.amt,l.cur),txt:(l.kind==='cap'?'رأس مال من ':'مسحوبات ')+(p?p.name:'')})}
 for(const x of DB.tips||[])m.push({t:x.t,box:x.box,v:(x.kind==='out'?-1:1)*cv(x.amt,x.cur),txt:x.kind==='out'?'توزيع بخشيش':'بخشيش فاتورة '+x.no});
 for(const a of DB.assets)if(a.box)m.push({t:a.t,box:a.box,v:-cv(a.cost,a.cur),txt:'شراء أصل: '+a.name});
 return m.sort((a,b)=>b.t-a.t)}
const boxBal=b=>roundM((S().open&&S().open[b]||0)+boxMoves().filter(x=>x.box===b).reduce((a,x)=>a+x.v,0));
const custDebts=()=>roundM(DB.customers.reduce((s,c)=>s+Math.max(0,balance(c.id)),0));
const supDebts=()=>roundM(DB.suppliers.reduce((a,s)=>a+Math.max(0,supBal(s.id)),0));
const stockVal=()=>roundM(DB.products.reduce((a,p)=>a+((p.track&&p.stock>0?p.stock:0)+Object.values(p.ws||{}).reduce((x,v)=>x+Math.max(0,v),0))*pCost(p),0));
/* الأصول: قسط اهتلاك ثابت */
function assetBook(a){const yrs=Math.max(0,(Date.now()-a.t)/(365.25*864e5)),c=cv(a.cost,a.cur),dep=a.life>0?Math.min(c,c/a.life*yrs):0;return {cost:roundM(c),dep:roundM(dep),book:roundM(c-dep)}}
/* الشركاء */
const pBal=pid=>roundM(DB.pledger.filter(l=>l.pid===pid).reduce((a,l)=>a+(l.kind==='wd'?-1:1)*cv(l.amt,l.cur),0));
const pCap=pid=>roundM(DB.pledger.filter(l=>l.pid===pid&&l.kind==='cap').reduce((a,l)=>a+cv(l.amt,l.cur),0));
function netProfit(k){const o=stats(k),[st,en]=prange(k),ex=expTotal(st,en);return roundM(S().costOn?o.profit-ex:o.rev-ex-purTotal(st,en))}
/* العروض على المنتجات */
function offerOf(p){if(!DB.offers||!DB.offers.length||!p)return null;const n=Date.now();return DB.offers.find(o=>o.pid===p.id&&(!o.from||o.from<=n)&&(!o.to||o.to>=n))||null}

{const f=A.saveprod;A.saveprod=(d,el,e)=>{const x=readProd(),n=DB.products.length;f(d,el,e);const p=x.id?prodById(x.id):(DB.products.length>n?DB.products[DB.products.length-1]:null);if(p&&p.name===x.name){p.taxEx=!!x.taxEx;flush()}}}

{const f=SH.pay;SH.pay=p=>{let h=f(p);if(!txOn())return h;const sub=cartTotal(carts.sale),d=discAmt(sub),t=taxOf(carts.sale,sub,d);if(!t.tax)return h;

{const f=vPos;vPos=function(){const h=f();return S().taxMode==='excl'&&+S().taxRate?h.replace('<small>الإجمالي</small>',`<small>الإجمالي (قبل ${esc(txName())})</small>`):h}}

{const f=receiptText;receiptText=function(s){let t=f(s);if(!s||!s.tax)return t;const m=v=>money(v,s.cur),L=`${s.taxM==='excl'?'':'شامل '}${txName()} ${s.taxR}%: ${m(s.tax)}\n`;

{const f=stats;stats=function(k){const o=f(k),[st,en]=prange(k);o.tax=0;for(const s of DB.sales){if(s.refunded||!s.tax||s.t<st||s.t>en)continue;const v=conv(s.tax,s.cur,S().cur,s.rate);o.tax+=v;if(s.taxM==='incl')o.profit-=v}return o}}
{const f=tabNet;tabNet=function(){const h=f(),[st,en]=prange(ui.period),t=taxSum(st-1,en);if(!(t>0))return h;

 return h.replace(/(<span>مبيعات كاش<\/span><b>[^<]*<\/b><\/div>)/,`$1<div class="kv"><span>&nbsp;&nbsp;${esc(txName())} المحصّلة بالفترة</span><b>${money(roundM(t))}</b></div>`)}}

{const f=reportText;reportText=function(k,hp){const t=f(k,hp),[st,en]=prange(k),x=taxSum(st-1,en);if(!(x>0))return t;return t.replace(/(المبيعات: [^\n]*\n)/,`$1${txName()} المحصّلة: ${money(roundM(x))}\n`)}}

async function khUpdCheck(force){
 if(!KHB.v||KHB.f.indexOf('__')===0||!navigator.onLine)return null;
 if(!force&&ui.khUpd!==undefined&&Date.now()-(ui.khUpdAt||0)<6*3600e3)return ui.khUpd;
 try{const l=await (await fetch(UPD_API,{headers:{Accept:'application/vnd.github+json'}})).json();if(!Array.isArray(l))return null;
  const re=new RegExp('^'+KHB.f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)\\.'+KHB.k+'$');let best=null;
  for(const r of l)for(const a of (r.assets||[])){const m=re.exec(a.name);if(m&&+m[1]>KHB.v&&(!best||+m[1]>best.n))best={n:+m[1],url:a.browser_download_url,mb:Math.round((a.size||0)/1048576),notes:r.body||''}}
  ui.khUpd=best;ui.khUpdAt=Date.now();render();return best}catch(e){return null}}
