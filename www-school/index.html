<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233F">
<title>الخنساء لإدارة المدارس</title>
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#121A2B;--mut:#5E6A80;--line:#DCE1EA;--soft:#E7ECF4;--pri:#14233F;--onpri:#fff;--gold:#C9962E;--ok:#1F8A5B;--okbg:#DDF3E8;--bad:#C93B2B;--badbg:#FBE3DF;--low:#B56A00;--lowbg:#FFEFD2;--blue:#2F6FD6;--bluebg:#E3EDFC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
b,h1,h2,h3{font-weight:800}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
.side{display:none}
.hd{background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;min-height:56px}
.hd h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ib{background:rgba(255,255,255,.14)}
.ib{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.main{overflow-y:auto;padding:14px 14px 90px}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--mut);font-size:11.5px;font-weight:700}
.nav button.on{color:var(--pri);background:var(--soft)}
@media (min-width:900px){
 #app{grid-template-columns:230px 1fr;grid-template-rows:auto 1fr}
 .side{display:flex;flex-direction:column;grid-row:1/3;background:var(--pri);color:#fff;padding:18px 10px;gap:4px;overflow-y:auto}
 .side .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
 .side .brand img{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain}
 .side .brand b{font-size:15px;line-height:1.3}.side .brand small{display:block;opacity:.7;font-size:12px;font-weight:600}
 .side button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:700;color:rgba(255,255,255,.8);text-align:start}
 .side button.on{background:rgba(255,255,255,.14);color:#fff}.side button:hover{background:rgba(255,255,255,.08)}
 .nav{display:none}.main{padding:22px 26px 40px}.hd{grid-column:2}
 .g4{grid-template-columns:repeat(4,1fr)!important}.g3w{grid-template-columns:repeat(3,1fr)!important}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4,.g3w{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi small{color:var(--mut);font-weight:700;display:flex;gap:6px;align-items:center}.kpi b{display:block;font-size:22px;margin-top:4px}
.kpi.blue b{color:var(--blue)}.kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--bad)}.kpi.gold b{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--soft)}
.btn.pri{background:var(--pri);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{color:var(--bad)}.btn.wide{width:100%}.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wa{background:#1FA855;color:#fff}
.mt{margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.li .gr{flex:1;min-width:0}.li .gr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li small{color:var(--mut)}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pri);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--soft);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.low{background:var(--lowbg);color:var(--low)}.badge.blue{background:var(--bluebg);color:var(--blue)}
.f{display:block;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--mut)}
.f input,.f select,.f textarea,.inp{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-size:15px;font-weight:500}
.f textarea{min-height:70px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-weight:700;font-size:13.5px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}.seg button{flex:1;padding:7px 6px;border-radius:9px;font-weight:700;font-size:13.5px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.srch input{flex:1;border:0;background:none;padding:11px 0;outline:none}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.empty svg{width:40px;height:40px;opacity:.5}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}.kv span{color:var(--mut)}
table.t{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:7px 8px;text-align:center}table.t th{background:var(--soft);font-weight:800}
table.t td.nm{text-align:start;white-space:nowrap}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line);margin-bottom:12px}
.mk{width:62px;padding:6px;border:1.5px solid var(--line);border-radius:8px;text-align:center;background:var(--card)}
.att{display:flex;gap:4px}.att button{width:36px;height:34px;border-radius:9px;background:var(--soft);font-weight:800;font-size:13px}
.att button.p.on{background:var(--ok);color:#fff}.att button.a.on{background:var(--bad);color:#fff}.att button.l.on{background:var(--low);color:#fff}.att button.e.on{background:var(--blue);color:#fff}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#1b1403;border-radius:16px;padding:13px 18px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:5}
@media (min-width:900px){.fab{bottom:26px}}
.shade{position:fixed;inset:0;background:rgba(8,14,26,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.shade{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 12px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#121A2B;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;font-weight:700;max-width:90%}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.prof{display:flex;gap:14px;align-items:center}.prof .ph{width:84px;height:84px;border-radius:18px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--pri)}
.prof .ph img{width:100%;height:100%;object-fit:cover}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.docs label{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700}
.tt td{min-width:90px;height:44px;font-size:12.5px}.tt td.x{cursor:pointer}
#print{display:none}
@media print{
 body{background:#fff}#app,.toast,.shade{display:none!important}#print{display:block}
 @page{size:A4;margin:12mm}
 .pg{page-break-after:always;font-size:13px;color:#000}.pg:last-child{page-break-after:auto}
 .ph1{display:flex;align-items:center;gap:14px;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:12px}
 .ph1 img{width:70px;height:70px;object-fit:contain}.ph1 h2{margin:0;font-size:20px}.ph1 .sp{flex:1}
 .pt{width:100%;border-collapse:collapse;margin:8px 0}.pt th,.pt td{border:1px solid #000;padding:5px 7px;text-align:center}.pt th{background:#eee}
 .pkv{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}.pkv div{border-bottom:1px dotted #999;padding:3px 0}
 .sig{display:flex;justify-content:space-between;margin-top:40px}
 .idc{display:inline-block;width:85mm;height:54mm;border:1.5px solid #000;border-radius:3mm;margin:3mm;padding:3mm;vertical-align:top;position:relative;overflow:hidden}
 .idc .top{background:#14233F;color:#fff;margin:-3mm -3mm 2mm;padding:2mm 3mm;font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px}
 .idc img.p{width:22mm;height:26mm;object-fit:cover;border:1px solid #000;float:left}
 .cert{border:6px double #14233F;padding:20mm;text-align:center;min-height:240mm}.cert h1{font-size:34px;margin:10mm 0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
/* ============ الخنساء للتعليم: الأساس ============ */
const ED='school',Q=ED==='quran',VERSION='1.0.0';
const APPNAME=Q?'الخنساء للمعاهد والحلقات':'الخنساء لإدارة المدارس';
const L=Q?{cls:'حلقة',clsP:'الحلقات',tch:'الأستاذ',tchP:'الأساتذة',stu:'طالب',stuP:'الطلاب',fees:'الاشتراكات'}:{cls:'صف',clsP:'الصفوف',tch:'المعلم',tchP:'الكادر التدريسي',stu:'طالب',stuP:'الطلاب',fees:'الأقساط'};
const KEY='kh_edu_'+ED;
const SURAS='الفاتحة البقرة آل_عمران النساء المائدة الأنعام الأعراف الأنفال التوبة يونس هود يوسف الرعد إبراهيم الحجر النحل الإسراء الكهف مريم طه الأنبياء الحج المؤمنون النور الفرقان الشعراء النمل القصص العنكبوت الروم لقمان السجدة الأحزاب سبأ فاطر يس الصافات ص الزمر غافر فصلت الشورى الزخرف الدخان الجاثية الأحقاف محمد الفتح الحجرات ق الذاريات الطور النجم القمر الرحمن الواقعة الحديد المجادلة الحشر الممتحنة الصف الجمعة المنافقون التغابن الطلاق التحريم الملك القلم الحاقة المعارج نوح الجن المزمل المدثر القيامة الإنسان المرسلات النبأ النازعات عبس التكوير الانفطار المطففين الانشقاق البروج الطارق الأعلى الغاشية الفجر البلد الشمس الليل الضحى الشرح التين العلق القدر البينة الزلزلة العاديات القارعة التكاثر العصر الهمزة الفيل قريش الماعون الكوثر الكافرون النصر المسد الإخلاص الفلق الناس'.split(' ').map(s=>s.replace(/_/g,' '));
const AYAT=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const GRADES=['ممتاز','جيد جداً','جيد','مقبول','يعاد'];
const DOCS_S=['صورة شخصية','شهادة ميلاد / قيد نفوس','صورة دفتر العائلة','صورة هوية الولي','بطاقة اللقاح','وثيقة نقل / تسلسل','الجلاء السابق','تعهد ولي الأمر'];
const DOCS_Q=['صورة شخصية','صورة هوية الولي','موافقة ولي الأمر'];
const SUBJ=['التربية الإسلامية','اللغة العربية','الرياضيات','العلوم','اللغة الإنكليزية','الاجتماعيات','الفيزياء والكيمياء','اللغة الفرنسية','التربية الفنية','التربية الرياضية','المعلوماتية'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','السبت'];

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toLatin=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.');
const num=v=>{const n=parseFloat(toLatin(v).replace(/[^\d.\-]/g,''));return isFinite(n)?n:0};
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const p2=n=>String(n).padStart(2,'0');
const isoD=t=>{const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const dt=t=>{const d=new Date(t);return `${isoD(t)} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const today=()=>isoD(Date.now());
const norm=s=>toLatin(String(s||'').toLowerCase()).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const val=id=>{const e=$('#'+id);return e?String(e.value).trim():''};
const money=v=>fmt(Math.round(v||0))+' '+(S().cur||'ل.س');
const age=b=>{if(!b)return '';const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0&&a<100?a:''};

const fresh=()=>({set:{name:'',phone:'',addr:'',manager:'',year:(new Date().getFullYear())+'-'+(new Date().getFullYear()+1),cur:'ل.س',logo:'',terms:['الفصل الأول','الفصل الثاني'],periods:Q?3:7,days:Q?['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس']:DAYS.slice(0,5),docs:Q?DOCS_Q:DOCS_S,feesOn:!Q,pass:50},
 classes:[],students:[],teachers:[],att:{},exams:[],marks:{},pays:[],tpays:[],exps:[],tt:{},hifz:[],tests:[],log:[],seq:0,rseq:0,ready:false});
let DB;try{DB=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'));DB.set=Object.assign(fresh().set,DB.set||{})}catch(e){DB=fresh()}
const S=()=>DB.set;
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(flush,250)}
function flush(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('الذاكرة ممتلئة! خفف الصور أو خذ نسخة احتياطية',6000)}}
function logA(x){DB.log.unshift({t:Date.now(),x});if(DB.log.length>800)DB.log.length=800}
function toast(m,ms){const o=$('.toast');if(o)o.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2600)}

const stuById=id=>DB.students.find(s=>s.id===id);
const clsById=id=>DB.classes.find(c=>c.id===id);
const tchById=id=>DB.teachers.find(t=>t.id===id);
const clsName=id=>{const c=clsById(id);return c?c.name:'بدون '+L.cls};
const active=()=>DB.students.filter(s=>s.status!=='left');
const inCls=cid=>active().filter(s=>s.cid===cid).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
/* الأقساط */
const feeOf=s=>{const c=clsById(s.cid);const f=s.fee!=null&&s.fee!==''?+s.fee:(c?+c.fee||0:0);return Math.max(0,f-(+s.disc||0))};
const paidOf=sid=>DB.pays.filter(p=>p.sid===sid).reduce((a,p)=>a+p.amt,0);
const dueOf=s=>Math.max(0,feeOf(s)-paidOf(s.id));
/* الحضور */
const attKey=(d,cid)=>d+'|'+cid;
function attStats(sid){let p=0,a=0,l=0,e=0;for(const [k,v] of Object.entries(DB.att)){const x=v[sid];if(x==='p')p++;else if(x==='a')a++;else if(x==='l')l++;else if(x==='e')e++}return {p,a,l,e,n:p+a+l+e}}
/* الحفظ */
const hifzOf=sid=>DB.hifz.filter(h=>h.sid===sid).sort((a,b)=>b.t-a.t);
const pagesOf=sid=>DB.hifz.filter(h=>h.sid===sid&&h.type==='h').reduce((a,h)=>a+(+h.pages||0),0);
const juzOf=sid=>Math.min(30,Math.round(pagesOf(sid)/20*10)/10);
const posTxt=h=>h?`${SURAS[h.s2]||''} ${h.a2||''}`:'—';

const I={home:'M3 11l9-8 9 8 M5 10v10h14V10',users:'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M22 20v-2a4 4 0 0 0-3-3.9 M16 2.1a4 4 0 0 1 0 7.8',cls:'M3 4h18v12H3z M8 20h8 M12 16v4',check:'M20 6L9 17l-5-5',chart:'M3 3v18h18 M7 15l4-4 3 3 5-6',money:'M2 6h20v12H2z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M6 12h.01 M18 12h.01',

function pickImg(max,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)};i.click()}

 DB.hifz.push({id:uid(),sid:d.id,t:Date.now(),type:ui.ht||'h',s1,a1,s2,a2,pages:num(val('h_pg')),grade:ui.hg||GRADES[0],note:val('h_note')});flush();back();toast('تم ✓')};

A.impok=()=>{let n=0;val('imp').split('\n').forEach(l=>{const c=l.split(/\t|;|,/).map(x=>x.trim());if(!c[0])return;let cl=DB.classes.find(x=>norm(x.name)===norm(c[3]||''));if(!cl&&c[3]){cl={id:uid(),name:c[3],fee:0,subs:Q?[]:SUBJ.slice(0,6).map(x=>({n:x,max:100}))};DB.classes.push(cl)}
 DB.students.push({id:uid(),no:++DB.seq,name:c[0],father:c[1]||'',phone:c[2]||'',cid:cl?cl.id:(DB.classes[0]||{}).id||'',gender:'m',join:today(),status:'active',docs:{}});n++});flush();back();toast(`تم استيراد ${n} ${L.stu}`)};
A.backup=()=>{const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`نسخة-${S().name||'الخنساء'}-${today()}.json`;a.click();toast('تم حفظ النسخة')};
A.restore=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.set||!d.students)throw 0;if(!confirm('رح تنمسح البيانات الحالية وتنحط النسخة. متأكد؟'))return;DB=Object.assign(fresh(),d);flush();location.reload()}catch(e){toast('الملف مو نسخة صحيحة')}};r.readAsText(i.files[0])};i.click()};

const NATIVE=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const phd=t=>`<div class="ph1">${S().logo?`<img src="${S().logo}">`:''}<div class="sp"><h2>${esc(S().name)}</h2><div>${esc(S().addr||'')}${S().phone?' · '+esc(S().phone):''}</div></div><div style="text-align:left"><b>${t}</b><div>${esc(S().year)}</div></div></div>`;
function doPrint(html){$('#print').innerHTML=html;if(NATIVE()){ui.pv=html;go('pview',{},true);return}setTimeout(()=>window.print(),80)}
SH.pview=()=>`<h3>معاينة</h3><p style="color:var(--mut);margin:0 0 8px">الطباعة على ورق A4 من نسخة الكمبيوتر. هون فيك تاخد صورة للشاشة وتبعتها.</p><div style="background:#fff;color:#000;border:1px solid var(--line);padding:10px;zoom:.55">${ui.pv||''}</div>`;
function prRcpt(p){const s=stuById(p.sid)||{};doPrint(`<div class="pg">${phd('إيصال قبض رقم '+p.no)}<div class="pkv"><div>التاريخ: ${dt(p.t)}</div><div>رقم الإيصال: ${p.no}</div><div>استلمنا من: ولي أمر ${L.stu} <b>${esc(s.name)}</b></div><div>${L.cls}: ${esc(clsName(s.cid))}</div><div>المبلغ: <b>${money(p.amt)}</b></div><div>البيان: ${esc(p.note||L.fees)}</div><div>المدفوع حتى تاريخه: ${money(paidOf(s.id))}</div><div>المتبقي: ${money(dueOf(s))}</div></div><div class="sig"><div>توقيع المستلم</div><div>الختم</div></div></div>`)}
const stuInfoRows=s=>[['الاسم',s.name],['رقم التسجيل',s.no],['اسم الأب',s.father],['اسم الأم',s.mother],['تاريخ الميلاد',s.birth],['مكان الولادة',s.bplace],['الجنس',s.gender==='f'?'أنثى':'ذكر'],['الرقم الوطني',s.nid],[L.cls,clsName(s.cid)],['تاريخ التسجيل',s.join],['هاتف الولي',s.phone],['هاتف آخر',s.phone2],['العنوان',s.addr],['المدرسة السابقة',s.prev],['ملاحظات صحية',s.health]];
A.pform=d=>{const s=stuById(d.id);doPrint(`<div class="pg">${phd('استمارة تسجيل '+L.stu)}<div style="display:flex;gap:14px"><div class="pkv" style="flex:1">${stuInfoRows(s).map(([k,v])=>`<div>${k}: <b>${esc(v||'')}</b></div>`).join('')}</div>${s.photo?`<img src="${s.photo}" style="width:35mm;height:45mm;object-fit:cover;border:1px solid #000">`:'<div style="width:35mm;height:45mm;border:1px solid #000;display:flex;align-items:center;justify-content:center">صورة</div>'}</div>
 <h3>الأوراق المسلّمة</h3><table class="pt"><tr>${(S().docs||[]).map(x=>`<th>${esc(x)}</th>`).join('')}</tr><tr>${(S().docs||[]).map(x=>`<td>${s.docs&&s.docs[x]?'✔':''}</td>`).join('')}</tr></table>
 <p>أتعهد أنا ولي أمر ${L.stu} المذكور أعلاه بالالتزام بأنظمة ${esc(S().name)} وتعليماتها.</p><div class="sig"><div>توقيع ولي الأمر</div><div>${Q?'المشرف':'المدير'}: ${esc(S().manager||'')}</div><div>الختم</div></div></div>`)};
const idCard=s=>`<div class="idc"><div class="top">${S().logo?`<img src="${S().logo}" style="width:7mm;height:7mm;background:#fff;border-radius:1mm">`:''}${esc(S().name)}</div>${s.photo?`<img class="p" src="${s.photo}">`:'<div style="width:22mm;height:26mm;border:1px solid #000;float:left"></div>'}<div style="font-size:11px;line-height:1.7"><b style="font-size:13px">${esc(s.name)}</b><br>${L.cls}: ${esc(clsName(s.cid))}<br>رقم: ${s.no}<br>الولي: ${esc(s.phone||'')}<br>العام: ${esc(S().year)}</div></div>`;
A.pcard=d=>doPrint(`<div class="pg">${idCard(stuById(d.id))}</div>`);
A.pcards=()=>{const l=(ui.cc?inCls(ui.cc):active());if(!l.length)return toast('ما في '+L.stuP);let h='';for(let i=0;i<l.length;i+=8)h+=`<div class="pg">${l.slice(i,i+8).map(idCard).join('')}</div>`;doPrint(h)};
function reportPage(s){const ex=DB.exams.filter(e=>e.cid===s.cid),c=clsById(s.cid),subs=(c&&c.subs)||[],terms=S().terms||[];
 const cell=(e,sb)=>{const v=((DB.marks[e.id]||{})[s.id]||{})[sb.n];return v===''||v==null?'':v};
 let tot=0,max=0;const rows=subs.map(sb=>{let g=0,m=0;ex.forEach(e=>{const v=cell(e,sb);if(v!==''){g+=+v;m+=+sb.max}});tot+=g;max+=m;const pct=m?g/m*100:null;return `<tr><td style="text-align:right">${esc(sb.n)}</td>${ex.map(e=>`<td>${cell(e,sb)}</td>`).join('')}<td><b>${fmt(g)}</b></td><td>${m?fmt(m):''}</td><td>${pct==null?'':(pct>=S().pass?'ناجح':'<b>راسب</b>')}</td></tr>`}).join('');
 const avg=max?Math.round(tot/max*1000)/10:0;const rk=rankIn(s);
 return `<div class="pg">${phd('الجلاء المدرسي')}<div class="pkv"><div>${L.stu}: <b>${esc(s.name)}</b></div><div>${L.cls}: ${esc(clsName(s.cid))}</div><div>اسم الأب: ${esc(s.father||'')}</div><div>رقم التسجيل: ${s.no}</div></div>
 <table class="pt"><tr><th>المادة</th>${ex.map(e=>`<th>${esc(e.name)}<br><small>${esc(e.term||'')}</small></th>`).join('')}<th>المجموع</th><th>العظمى</th><th>النتيجة</th></tr>${rows}<tr><th>المجموع العام</th>${ex.map(()=>'<th></th>').join('')}<th>${fmt(tot)}</th><th>${fmt(max)}</th><th>${avg}%</th></tr></table>
 <div class="pkv"><div>المعدل: <b>${avg}%</b></div><div>الترتيب: <b>${rk?rk[0]+' من '+rk[1]:'—'}</b></div><div>أيام الغياب: ${attStats(s.id).a}</div><div>النتيجة العامة: <b>${avg>=S().pass?'ناجح':'راسب'}</b></div></div>
 <p>ملاحظات المرشد: ........................................................................................................</p><div class="sig"><div>مربي ال${L.cls}</div><div>ولي الأمر</div><div>${Q?'المشرف':'مدير المدرسة'}: ${esc(S().manager||'')}</div></div></div>`}
function avgOf(s){const ex=DB.exams.filter(e=>e.cid===s.cid),c=clsById(s.cid),subs=(c&&c.subs)||[];let g=0,m=0;ex.forEach(e=>subs.forEach(sb=>{const v=((DB.marks[e.id]||{})[s.id]||{})[sb.n];if(v!==''&&v!=null){g+=+v;m+=+sb.max}}));return m?g/m:null}
function rankIn(s){const l=inCls(s.cid).map(x=>[x.id,avgOf(x)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);const i=l.findIndex(x=>x[0]===s.id);return i<0?null:[i+1,l.length]}
A.preport=d=>doPrint(reportPage(stuById(d.id)));
A.pallreports=d=>{const l=inCls(d.id);if(!l.length)return toast('ما في '+L.stuP);doPrint(l.map(reportPage).join(''))};
A.presults=d=>{const e=DB.exams.find(x=>x.id===d.id),c=clsById(e.cid),subs=c.subs||[],m=DB.marks[e.id]||{};const rows=inCls(e.cid).map(s=>{const r=m[s.id]||{};let g=0,mx=0;subs.forEach(sb=>{if(r[sb.n]!==''&&r[sb.n]!=null){g+=+r[sb.n];mx+=+sb.max}});return [s,r,g,mx]}).sort((a,b)=>(b[3]?b[2]/b[3]:0)-(a[3]?a[2]/a[3]:0));
 doPrint(`<div class="pg">${phd('كشف نتائج: '+esc(e.name))}<div>${L.cls}: <b>${esc(c.name)}</b> · ${esc(e.term||'')}</div><table class="pt"><tr><th>#</th><th>الاسم</th>${subs.map(s=>`<th>${esc(s.n)}</th>`).join('')}<th>المجموع</th><th>%</th></tr>${rows.map(([s,r,g,mx],i)=>`<tr><td>${i+1}</td><td style="text-align:right">${esc(s.name)}</td>${subs.map(sb=>`<td>${r[sb.n]??''}</td>`).join('')}<td><b>${fmt(g)}</b></td><td>${mx?Math.round(g/mx*1000)/10:''}</td></tr>`).join('')}</table><div class="sig"><div>مربي ال${L.cls}</div><div>الإدارة</div></div></div>`)};
A.plist=d=>{const c=clsById(d.id);doPrint(`<div class="pg">${phd('قائمة أسماء')}<div>${L.cls}: <b>${esc(c.name)}</b></div><table class="pt"><tr><th>#</th><th>الاسم</th><th>اسم الأب</th><th>تاريخ الميلاد</th><th>هاتف الولي</th></tr>${inCls(c.id).map((s,i)=>`<tr><td>${i+1}</td><td style="text-align:right">${esc(s.name)}</td><td>${esc(s.father||'')}</td><td>${esc(s.birth||'')}</td><td>${esc(s.phone||'')}</td></tr>`).join('')}</table></div>`)};
A.pattsheet=d=>{const c=clsById(d.id);doPrint(`<div class="pg">${phd('ورقة تفقّد شهرية')}<div>${L.cls}: <b>${esc(c.name)}</b> · الشهر: ............</div><table class="pt"><tr><th>#</th><th>الاسم</th>${Array.from({length:26},(_,i)=>`<th style="padding:2px">${i+1}</th>`).join('')}</tr>${inCls(c.id).map((s,i)=>`<tr><td>${i+1}</td><td style="text-align:right;white-space:nowrap">${esc(s.name)}</td>${Array.from({length:26},()=>'<td></td>').join('')}</tr>`).join('')}</table></div>`)};
A.ptt=d=>{const c=clsById(d.id),g=DB.tt[d.id]||{},days=S().days||DAYS,np=+S().periods||7;doPrint(`<div class="pg">${phd('البرنامج الأسبوعي')}<div>${L.cls}: <b>${esc(c.name)}</b></div><table class="pt"><tr><th>اليوم</th>${Array.from({length:np},(_,i)=>`<th>الحصة ${i+1}</th>`).join('')}</tr>${days.map((x,di)=>`<tr><th>${x}</th>${Array.from({length:np},(_,pi)=>`<td>${esc(g[di+'-'+pi]||'')}</td>`).join('')}</tr>`).join('')}</table></div>`)};
A.pdues=()=>{const l=active().filter(s=>(!ui.fc||s.cid===ui.fc)&&dueOf(s)>0).sort((a,b)=>dueOf(b)-dueOf(a));doPrint(`<div class="pg">${phd('كشف المتأخرين عن الدفع')}<table class="pt"><tr><th>#</th><th>الاسم</th><th>${L.cls}</th><th>هاتف الولي</th><th>المطلوب</th><th>المدفوع</th><th>المتبقي</th></tr>${l.map((s,i)=>`<tr><td>${i+1}</td><td style="text-align:right">${esc(s.name)}</td><td>${esc(clsName(s.cid))}</td><td>${esc(s.phone||'')}</td><td>${money(feeOf(s))}</td><td>${money(paidOf(s.id))}</td><td><b>${money(dueOf(s))}</b></td></tr>`).join('')}<tr><th colspan="6">المجموع</th><th>${money(l.reduce((a,s)=>a+dueOf(s),0))}</th></tr></table></div>`)};
A.pcert=d=>{const s=stuById(d.id),j=juzOf(s.id);const t=prompt('سبب الشهادة',j>=30?'إتمام حفظ كتاب الله كاملاً':`حفظ ${j} ${j>10?'جزءاً':'أجزاء'} من القرآن الكريم`);if(t==null)return;
 doPrint(`<div class="pg"><div class="cert">${S().logo?`<img src="${S().logo}" style="width:30mm">`:''}<h2>${esc(S().name)}</h2><h1>شهادة تقدير</h1><p style="font-size:18px;line-height:2.2">يسرّ إدارة ${esc(S().name)} أن تمنح ${s.gender==='f'?'الطالبة':'الطالب'}<br><b style="font-size:26px">${esc(s.name)}</b><br>هذه الشهادة تقديراً ${s.gender==='f'?'لها':'له'} على<br><b>${esc(t)}</b><br>سائلين الله ${s.gender==='f'?'لها':'له'} التوفيق والسداد</p><div class="sig" style="margin-top:30mm"><div>التاريخ: ${today()}</div><div>${esc(S().manager||'الإدارة')}</div><div>الختم</div></div></div></div>`)};

/* ============ التشغيل ============ */
render();

</script>
